      - company: Google
        position: Research Scientist
        location: Mountain View, CA
        start_date: 2025
        end_date: present
        highlights:
          - Analyze large-scale training runs for metric anomalies that may be caused by data contamination.
          - Develop improved decontamination recipes and test-train overlap metrics to identify contamination early and increase evaluation signal-to-noise ratio.
          - Study how training stages affect performance, memorization, and generalization.
          - Improve task-specific, efficient small language models using synthetic data.

      - company: Boston University Artificial Intelligence Research Group
        position: PhD Research Fellow
        location: Boston, MA
        start_date: 2020
        end_date: 2025
        highlights:
          - Studied natural language evaluation, with an emphasis on data contamination and its effect on reported model performance.
          - Improved sentence embeddings, compositional generalization evaluation, and cross-lingual representations through augmentation, multitask learning, and contrastive learning.
          - Conducted temporal bias research funded by the 2021 Google Research Scholar Program.
          - Led an Ottoman handwritten text recognition project that received $50K from the Scientific Research Council of Turkey.

