[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  NODE_VERSION = "24"
  RUBY_VERSION = "3.3.6"
  BUNDLER_VERSION = "4.0.6"

[context.deploy-preview]
  command = "npm run build:css && bundle exec jekyll build --baseurl $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "npm run build:css && bundle exec jekyll build --baseurl $DEPLOY_PRIME_URL"
